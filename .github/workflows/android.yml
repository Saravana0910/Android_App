name: Android CI

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      maeva_base_url:
        description: 'Maeva site origin, e.g. https://networkcty.force.com'
        required: false
        type: string
      maeva_site_path:
        description: 'Experience Cloud site path, e.g. /NestSFA/s/'
        required: false
        type: string
      maeva_start_path:
        description: 'Launch path, e.g. /login (separate from record routes)'
        required: false
        type: string
      build_release:
        description: 'Also build a release APK and AAB'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # `packages: ''` disables the action's default install, which still
      # references the retired `tools` package and fails.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
            echo "Firebase configuration applied."
          else
            echo "::warning title=Firebase not configured::GOOGLE_SERVICES_JSON secret is absent. The APK will build but push notifications will be inactive."
          fi

      - name: Resolve build configuration
        id: config
        env:
          INPUT_BASE_URL: ${{ inputs.maeva_base_url }}
          INPUT_SITE_PATH: ${{ inputs.maeva_site_path }}
          INPUT_START_PATH: ${{ inputs.maeva_start_path }}
          VAR_BASE_URL: ${{ vars.MAEVA_BASE_URL }}
          VAR_SITE_PATH: ${{ vars.MAEVA_SITE_PATH }}
          VAR_START_PATH: ${{ vars.MAEVA_START_PATH }}
          VAR_ALLOWED_DOMAINS: ${{ vars.MAEVA_ALLOWED_DOMAINS }}
        run: |
          ARGS=""
          BASE_URL="${INPUT_BASE_URL:-${VAR_BASE_URL}}"
          SITE_PATH="${INPUT_SITE_PATH:-${VAR_SITE_PATH}}"
          START_PATH="${INPUT_START_PATH:-${VAR_START_PATH}}"
          if [ -n "${BASE_URL}" ]; then
            ARGS="${ARGS} -PmaevaBaseUrl=${BASE_URL}"
          fi
          if [ -n "${SITE_PATH}" ]; then
            ARGS="${ARGS} -PmaevaSitePath=${SITE_PATH}"
          fi
          if [ -n "${START_PATH}" ]; then
            ARGS="${ARGS} -PmaevaStartPath=${START_PATH}"
          fi
          if [ -n "${VAR_ALLOWED_DOMAINS}" ]; then
            ARGS="${ARGS} -PmaevaAllowedDomains=${VAR_ALLOWED_DOMAINS}"
          fi
          ARGS="${ARGS} -PmaevaVersionCode=${GITHUB_RUN_NUMBER}"
          echo "args=${ARGS}" >> "${GITHUB_OUTPUT}"
          echo "Gradle arguments: ${ARGS}"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug ${{ steps.config.outputs.args }} --stacktrace

      - name: Verify debug APK signature and alignment
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "${APK}"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 4 "${APK}"

      - name: Run Android Lint
        working-directory: android
        run: ./gradlew lintDebug ${{ steps.config.outputs.args }} --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maeva-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          else
            echo "::warning title=Firebase not configured::Release build will have no push notifications."
          fi

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for NAME in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "::error title=Release signing required::Configure all four ANDROID signing secrets. For testing without a release key, download maeva-debug-apk and install app-debug.apk."
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/maeva.jks"
          echo "keystore=${RUNNER_TEMP}/maeva.jks" >> "${GITHUB_OUTPUT}"
          echo "Signing keystore decoded."

      - name: Resolve build configuration
        id: config
        env:
          INPUT_BASE_URL: ${{ inputs.maeva_base_url }}
          INPUT_SITE_PATH: ${{ inputs.maeva_site_path }}
          INPUT_START_PATH: ${{ inputs.maeva_start_path }}
          VAR_BASE_URL: ${{ vars.MAEVA_BASE_URL }}
          VAR_SITE_PATH: ${{ vars.MAEVA_SITE_PATH }}
          VAR_START_PATH: ${{ vars.MAEVA_START_PATH }}
          VAR_ALLOWED_DOMAINS: ${{ vars.MAEVA_ALLOWED_DOMAINS }}
        run: |
          ARGS=""
          BASE_URL="${INPUT_BASE_URL:-${VAR_BASE_URL}}"
          SITE_PATH="${INPUT_SITE_PATH:-${VAR_SITE_PATH}}"
          START_PATH="${INPUT_START_PATH:-${VAR_START_PATH}}"
          if [ -n "${BASE_URL}" ]; then
            ARGS="${ARGS} -PmaevaBaseUrl=${BASE_URL}"
          fi
          if [ -n "${SITE_PATH}" ]; then
            ARGS="${ARGS} -PmaevaSitePath=${SITE_PATH}"
          fi
          if [ -n "${START_PATH}" ]; then
            ARGS="${ARGS} -PmaevaStartPath=${START_PATH}"
          fi
          if [ -n "${VAR_ALLOWED_DOMAINS}" ]; then
            ARGS="${ARGS} -PmaevaAllowedDomains=${VAR_ALLOWED_DOMAINS}"
          fi
          ARGS="${ARGS} -PmaevaVersionCode=${GITHUB_RUN_NUMBER}"
          echo "args=${ARGS}" >> "${GITHUB_OUTPUT}"

      - name: Assemble release artifacts
        working-directory: android
        env:
          MAEVA_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          MAEVA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAEVA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAEVA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease ${{ steps.config.outputs.args }} --stacktrace

      - name: Verify release APK signature and alignment
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "${APK}"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -P 16 4 "${APK}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maeva-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
